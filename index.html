<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Primary Meta Tags -->
    <title>Our Adventure Log - Track Your Journey Together</title>
    <meta name="title" content="Our Adventure Log - Track Your Journey Together" />
    <meta name="description" content="Track your daily goals, workouts, study sessions, and progress together. Build streaks, earn XP, and level up your life!" />
    
    <!-- Viewport - Optimized for iPhone 17 Pro Max -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme Colors -->
    <meta name="theme-color" content="#0f0f1a" />
    <meta name="msapplication-TileColor" content="#0f0f1a" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- Apple Touch Icons - iOS -->
    <link rel="apple-touch-icon" href="/vite.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/vite.svg" />
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Adventure Log" />
    
    <!-- iOS Splash Screens - iPhone 17 Pro Max -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash-iphone-17-pro-max.png" />
    
    <!-- Disable iOS telephone number detection -->
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Microsoft -->
    <meta name="msapplication-config" content="none" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            // Service worker registration failed, app will work without offline support
          });
        });
      }
    </script>
  </body>
</html>
